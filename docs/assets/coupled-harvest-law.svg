<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="law-title law-desc">
  <title id="law-title">Coupled 7d x 5h Harvest Law and Dual Hard-Stops</title>
  <desc id="law-desc">A 168-hour weekly timeline split into 5-hour windows. Early week the engine is in PRESERVE_WINDOWS, mid-week it harvests only the last 45 minutes of expiring 5h windows (EXPIRING_5H_HARVEST), and in the final 24 hours, when weekly surplus reaches 0.85 of the remaining 5h drain capacity, it enters FULL_THROTTLE_HARVEST. Hard-Stop 1 halts every run 2 minutes before resetAt so 0.00% of the fresh cycle is touched. Hard-Stop 2 preempts within 25 ms of a human turn via the statev2.sqlite WAL and waits a 15-minute cooldown.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#070b15"/></linearGradient>
    <linearGradient id="lpanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121c30"/><stop offset="1" stop-color="#0d1524"/></linearGradient>
    <pattern id="lhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" fill="#ef4444" fill-opacity="0.24"/></pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <filter id="lglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .t1{fill:#e6edf7}.t2{fill:#94a3b8}.t3{fill:#64748b}.b{font-weight:700}
    .card{fill:url(#lpanel);stroke:#1f2a40}
  </style>
  <rect x="0.5" y="0.5" width="1099" height="399" rx="18" fill="url(#lbg)" stroke="#24324a"/>

  <text x="32" y="38" class="sans b t1" font-size="18">Coupled 7d × 5h Harvest Law&#160;<tspan class="t2" font-weight="500">&amp; Dual Hard-Stops</tspan></text>
  <text x="1068" y="38" text-anchor="end" class="mono t3" font-size="10.5">packages/core/src/pacing-engine.ts</text>
  <text x="32" y="62" class="mono t2" font-size="11.5"><tspan class="t1">S_week</tspan> = max(0, R_week − 20%)&#160;&#160;&#160;&#160;<tspan class="t1">ratio</tspan> = S_week / (⌈T_left / 5h⌉ × C_5h)&#160;&#160;&#160;&#160;<tspan class="t1">C_5h</tspan> = 14% / window&#160;&#160;&#160;&#160;<tspan fill="#6ee7b7">FULL_THROTTLE ⇔ ratio ≥ 0.85</tspan></text>

  <!-- phase labels -->
  <text x="231.7" y="90" text-anchor="middle" class="mono b" font-size="11" fill="#93c5fd">PRESERVE_WINDOWS</text>
  <text x="628.7" y="90" text-anchor="middle" class="mono b" font-size="11" fill="#fcd34d">EXPIRING_5H_HARVEST</text>
  <text x="897.0" y="90" text-anchor="middle" class="mono b" font-size="9" fill="#86efac">FULL_THROTTLE_HARVEST</text>
  <path d="M419.3 81 L427.3 86 L419.3 91 Z" fill="#64748b"/>
  <path d="M830.0 81 L838.0 86 L830.0 91 Z" fill="#64748b"/>

  <!-- 5h windows -->
  <rect x="41.0" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="68.4" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="95.8" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="123.1" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="150.5" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="177.9" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="205.3" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="232.7" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="260.0" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="287.4" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="314.8" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="342.2" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="369.6" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="397.0" y="98" width="25.4" height="20" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#3b5b8a" stroke-width="0.8"/><rect x="424.3" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="443.7" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="451.7" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="471.1" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="479.1" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="498.5" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="506.5" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="525.9" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="533.9" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="553.2" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="561.2" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="580.6" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="588.6" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="608.0" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="616.0" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="635.4" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="643.4" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="662.8" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="670.8" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="690.1" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="698.1" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="717.5" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="725.5" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="744.9" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="752.9" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="772.3" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="780.3" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="799.7" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="807.7" y="98" width="25.4" height="20" rx="3" fill="#f59e0b" fill-opacity="0.07" stroke="#6b5420" stroke-width="0.8"/><rect x="827.0" y="98" width="6.0" height="20" rx="2" fill="#fbbf24"/><rect x="835.0" y="98" width="25.4" height="20" rx="3" fill="#34d399" fill-opacity="0.8" stroke="#34d399" stroke-width="0.8"/><rect x="862.4" y="98" width="25.4" height="20" rx="3" fill="#34d399" fill-opacity="0.8" stroke="#34d399" stroke-width="0.8"/><rect x="889.8" y="98" width="25.4" height="20" rx="3" fill="#34d399" fill-opacity="0.8" stroke="#34d399" stroke-width="0.8"/><rect x="917.2" y="98" width="25.4" height="20" rx="3" fill="#34d399" fill-opacity="0.8" stroke="#34d399" stroke-width="0.8"/><rect x="944.6" y="98" width="14.4" height="20" rx="3" fill="#34d399" fill-opacity="0.8" stroke="#34d399" stroke-width="0.8"/>

  <!-- weekly remaining chart -->
  <rect x="40.0" y="182.4" width="920.0" height="13.6" fill="url(#lhatch)"/>
  <line x1="40.0" y1="182.4" x2="960.0" y2="182.4" stroke="#ef4444" stroke-width="1.2"/>
  <text x="48" y="193" class="mono b" font-size="8.5" fill="#fca5a5">20% EMERGENCY RESERVE FLOOR</text>
  <line x1="40.0" y1="196" x2="960.0" y2="196" stroke="#334155"/>
  <line x1="40.0" y1="128.0" x2="960.0" y2="182.4" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <polygon points="828.6,141.6 949.0,181.7 960.0,181.7 960.0,182.4 828.6,182.4" fill="#34d399" fill-opacity="0.2"/>
  <polyline points="40.0,128.0 231.7,131.4 423.3,135.5 626.0,138.9 828.6,141.6 949.0,181.7 960.0,181.7" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
  <line x1="828.6" y1="124" x2="828.6" y2="196" stroke="#6ee7b7" stroke-dasharray="3 3"/>
  <circle cx="828.6" cy="141.6" r="4.5" fill="#22d3ee" stroke="#0b1220" stroke-width="2" filter="url(#lglow)"/>
  <text x="820.6" y="160" text-anchor="end" class="mono b" font-size="9.5" fill="#6ee7b7">T_left 24h · R_week 80%</text>
  <g class="mono t3" font-size="9"><text x="40.0" y="210" text-anchor="start">168h</text><text x="171.4" y="210" text-anchor="middle">144h</text><text x="302.9" y="210" text-anchor="middle">120h</text><text x="434.3" y="210" text-anchor="middle">96h</text><text x="565.7" y="210" text-anchor="middle">72h</text><text x="697.1" y="210" text-anchor="middle">48h</text><text x="828.6" y="210" text-anchor="middle">24h</text><text x="960.0" y="210" text-anchor="end">0h</text></g>

  <!-- annotations -->
  <text x="231.7" y="222" text-anchor="middle" class="mono b" font-size="10" fill="#93c5fd">ratio &lt; 0.85 → bank the 5h windows</text>
  <text x="231.7" y="236" text-anchor="middle" class="mono t3" font-size="9">early week · surplus saved for later</text>
  <text x="628.7" y="222" text-anchor="middle" class="mono b" font-size="10" fill="#fcd34d">5h reset &lt; 45m ∧ pace ≥ 0 → drain the tail</text>
  <text x="628.7" y="236" text-anchor="middle" class="mono t3" font-size="9">mid week · only quota that would expire anyway</text>
  <text x="836.0" y="222" class="mono b" font-size="10" fill="#86efac">60% / (5 × 14%) = 0.86</text>
  <text x="836.0" y="236" class="mono t3" font-size="9">≥ 0.85 → burn every window</text>

  <!-- Hard-stop #1 wall + fresh cycle -->
  <rect x="966" y="78" width="100" height="122" rx="6" fill="#ef4444" fill-opacity="0.06"/>
  <rect x="966" y="78" width="100" height="122" rx="6" fill="url(#lhatch)" stroke="#ef4444" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <rect x="957" y="78" width="6" height="122" rx="2" fill="#ef4444" filter="url(#lglow)"/>
  <text x="1016" y="98" text-anchor="middle" class="mono b" font-size="9.5" fill="#f87171">HARD-STOP #1</text>
  <text x="1016" y="114" text-anchor="middle" class="mono t2" font-size="9">resetAt − 2 min</text>
  <text x="1016" y="140" text-anchor="middle" class="mono t2" font-size="9.5">new cycle</text>
  <text x="1016" y="166" text-anchor="middle" class="mono b" font-size="20" fill="#fca5a5">0.00%</text>
  <text x="1016" y="184" text-anchor="middle" class="mono t2" font-size="9.5">touched</text>

  <!-- Card A: state machine -->
  <rect x="32" y="252" width="334" height="130" rx="10" class="card"/>
  <text x="48" y="274" class="mono b t2" font-size="9.5" letter-spacing="0.8">STATE MACHINE · PER POOL · EVERY TICK</text>
  <rect x="48" y="286" width="62" height="20" rx="10" fill="#0f1d33" stroke="#60a5fa"/>
  <text x="79" y="299.5" text-anchor="middle" class="mono b" font-size="9" fill="#93c5fd">PRESERVE</text>
  <line x1="112" y1="296" x2="128" y2="296" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="132" y="286" width="80" height="20" rx="10" fill="#3a2a06" stroke="#f59e0b"/>
  <text x="172" y="299.5" text-anchor="middle" class="mono b" font-size="9" fill="#fcd34d">EXPIRING_5H</text>
  <line x1="214" y1="296" x2="230" y2="296" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="234" y="286" width="96" height="20" rx="10" fill="#052e1f" stroke="#34d399"/>
  <text x="282" y="299.5" text-anchor="middle" class="mono b" font-size="9" fill="#86efac">FULL_THROTTLE</text>
  <text x="48" y="332" class="mono t3" font-size="9.5">any</text>
  <line x1="72" y1="328.5" x2="92" y2="328.5" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="96" y="318" width="100" height="20" rx="10" fill="#3b0d12" stroke="#ef4444"/>
  <text x="146" y="331.5" text-anchor="middle" class="mono b" font-size="9" fill="#fca5a5">LOCKED_SHIELD</text>
  <text x="204" y="332" class="mono t3" font-size="9">R ≤ 20% or ≤ 2m to reset</text>
  <text x="48" y="358" class="mono t2" font-size="9.5">Router drops the pool; idle threads are</text>
  <text x="48" y="373" class="mono t2" font-size="9.5">re-routed via t3_thread_configure.</text>

  <!-- Card B: epoch lock -->
  <rect x="383" y="252" width="334" height="130" rx="10" class="card"/>
  <rect x="383" y="264" width="3" height="16" rx="1.5" fill="#ef4444"/>
  <text x="399" y="276" class="mono b" font-size="10" fill="#f87171">HARD-STOP #1 · resetAt EPOCH LOCK</text>
  <text x="399" y="312" class="mono b" font-size="26" fill="#fca5a5">0.00%</text>
  <text x="488" y="303" class="mono t2" font-size="9.5">of any fresh quota cycle</text>
  <text x="488" y="316" class="mono t2" font-size="9.5">is ever consumed</text>
  <text x="399" y="340" class="mono t2" font-size="9.5">every run stamped with targetWindowResetAt</text>
  <text x="399" y="355" class="mono t2" font-size="9.5">halt at hardDeadlineAt = resetAt − 2 min</text>
  <text x="399" y="370" class="mono t2" font-size="9.5">resetAt advances mid-run → instant halt</text>

  <!-- Card C: human preemption -->
  <rect x="734" y="252" width="334" height="130" rx="10" class="card"/>
  <rect x="734" y="264" width="3" height="16" rx="1.5" fill="#22d3ee"/>
  <text x="750" y="276" class="mono b" font-size="10" fill="#67e8f9">HARD-STOP #2 · HUMAN-FIRST PREEMPTION</text>
  <text x="750" y="312" class="mono b" font-size="26" fill="#a5f3fc">25 ms</text>
  <text x="846" y="303" class="mono t2" font-size="9.5">WAL write → pilot yields,</text>
  <text x="846" y="316" class="mono t2" font-size="9.5">zero patches to T3 Code</text>
  <text x="750" y="340" class="mono t2" font-size="9.5">fs.watch statev2.sqlite-wal · ?mode=ro</text>
  <text x="750" y="355" class="mono t2" font-size="9.5">human turn running → interrupt pilot run</text>
  <text x="750" y="370" class="mono t2" font-size="9.5">resume only after a 15 min idle cooldown</text>
</svg>
