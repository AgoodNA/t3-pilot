<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="gt-title gt-desc">
  <title id="gt-title">Guarded Turbo: the seatbelt between Auto and Full Access</title>
  <desc id="gt-desc">Three columns. Auto asks for approval on every routine command, so overnight runs stall. Guarded Turbo compiles one policy, .t3-pilot/shield.json, into a hard PreToolUse hook and a soft guarded-turbo SKILL.md, synced in one click to Antigravity .agents/hooks.json, Claude Code .claude/settings.json and Codex .codex/rules/t3-pilot-guarded-turbo.rules; catastrophic commands are denied, publishing asks, routine work is allowed. Full Access runs everything, including credential reads and force-pushes to main.</desc>
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#070b15"/></linearGradient>
    <linearGradient id="gpanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121c30"/><stop offset="1" stop-color="#0d1524"/></linearGradient>
    <linearGradient id="gcenter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e2a22"/><stop offset="0.35" stop-color="#0f1a2b"/><stop offset="1" stop-color="#0d1524"/></linearGradient>
    <marker id="garr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
    <marker id="garrg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#34d399"/></marker>
    <filter id="gglow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .t1{fill:#e6edf7}.t2{fill:#94a3b8}.t3{fill:#64748b}.b{font-weight:700}
    .row{fill:#0a111f;stroke:#1f2a40}
  </style>
  <rect x="0.5" y="0.5" width="1099" height="359" rx="18" fill="url(#gbg)" stroke="#24324a"/>
  <text x="32" y="38" class="sans b t1" font-size="18">The missing seatbelt between <tspan fill="#fbbf24">Auto</tspan> and <tspan fill="#f87171">Full Access</tspan></text>
  <text x="1068" y="38" text-anchor="end" class="mono t3" font-size="10.5">t3-pilot shield · one policy → three harnesses</text>

  <!-- friction / risk axis -->
  <line x1="182" y1="56" x2="918" y2="56" stroke="#334155" stroke-width="1"/>
  <text x="32" y="59.5" class="mono t3" font-size="9" letter-spacing="0.6">MORE FRICTION</text>
  <text x="1068" y="59.5" text-anchor="end" class="mono t3" font-size="9" letter-spacing="0.6">MORE BLAST RADIUS</text>

  <!-- ===== AUTO ===== -->
  <rect x="32" y="68" width="300" height="272" rx="14" fill="url(#gpanel)" stroke="#1f2a40"/>
  <text x="48" y="94" class="mono b" font-size="13" fill="#fbbf24">AUTO</text>
  <text x="316" y="94" text-anchor="end" class="mono t3" font-size="10">constant prompt fatigue</text>
  <text x="48" y="112" class="mono t2" font-size="9.5">every routine command waits on you</text>

  <rect x="48" y="124" width="268" height="30" rx="7" class="row"/>
  <circle cx="64" cy="139" r="7" fill="#3a2a06" stroke="#f59e0b"/>
  <text x="64" y="142.5" text-anchor="middle" class="mono b" font-size="9" fill="#fcd34d">?</text>
  <text x="78" y="143" class="mono t1" font-size="10">Allow: npm test</text>
  <rect x="258" y="131" width="50" height="16" rx="5" fill="#334155"/>
  <text x="283" y="142.5" text-anchor="middle" class="mono t1" font-size="9">Approve</text>

  <rect x="48" y="160" width="268" height="30" rx="7" class="row"/>
  <circle cx="64" cy="175" r="7" fill="#3a2a06" stroke="#f59e0b"/>
  <text x="64" y="178.5" text-anchor="middle" class="mono b" font-size="9" fill="#fcd34d">?</text>
  <text x="78" y="179" class="mono t1" font-size="10">Allow: git checkout -b fix</text>
  <rect x="258" y="167" width="50" height="16" rx="5" fill="#334155"/>
  <text x="283" y="178.5" text-anchor="middle" class="mono t1" font-size="9">Approve</text>

  <rect x="48" y="196" width="268" height="30" rx="7" class="row"/>
  <circle cx="64" cy="211" r="7" fill="#3a2a06" stroke="#f59e0b"/>
  <text x="64" y="214.5" text-anchor="middle" class="mono b" font-size="9" fill="#fcd34d">?</text>
  <text x="78" y="215" class="mono t1" font-size="10">Allow: npm run build</text>
  <rect x="258" y="203" width="50" height="16" rx="5" fill="#334155"/>
  <text x="283" y="214.5" text-anchor="middle" class="mono t1" font-size="9">Approve</text>

  <rect x="48" y="232" width="268" height="30" rx="7" class="row" stroke-dasharray="3 3"/>
  <circle cx="64" cy="247" r="7" fill="#3a2a06" stroke="#f59e0b"/>
  <text x="64" y="250.5" text-anchor="middle" class="mono b" font-size="9" fill="#fcd34d">?</text>
  <text x="78" y="251" class="mono t2" font-size="10">Allow: npx vitest&#160;&#160;· 03:12</text>
  <text x="300" y="251" text-anchor="end" class="mono" font-size="9" fill="#fbbf24">waiting…</text>

  <text x="48" y="286" class="mono t3" font-size="9" letter-spacing="0.6">APPROVALS PER HOUR</text>
  <g fill="#f59e0b">
    <rect x="48" y="294" width="14" height="8" rx="2"/><rect x="66" y="294" width="14" height="8" rx="2"/><rect x="84" y="294" width="14" height="8" rx="2"/>
    <rect x="102" y="294" width="14" height="8" rx="2"/><rect x="120" y="294" width="14" height="8" rx="2"/><rect x="138" y="294" width="14" height="8" rx="2"/>
    <rect x="156" y="294" width="14" height="8" rx="2"/><rect x="174" y="294" width="14" height="8" rx="2"/><rect x="192" y="294" width="14" height="8" rx="2"/>
    <rect x="210" y="294" width="14" height="8" rx="2"/><rect x="228" y="294" width="14" height="8" rx="2"/><rect x="246" y="294" width="14" height="8" rx="2"/>
    <rect x="264" y="294" width="14" height="8" rx="2"/><rect x="282" y="294" width="14" height="8" rx="2"/><rect x="300" y="294" width="14" height="8" rx="2"/>
  </g>
  <text x="48" y="326" class="sans t2" font-size="11.5">Safe, but overnight runs stall at prompt #1.</text>

  <!-- ===== GUARDED TURBO ===== -->
  <rect x="348" y="68" width="404" height="272" rx="14" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="4" filter="url(#gglow)"/>
  <rect x="348" y="68" width="404" height="272" rx="14" fill="url(#gcenter)" stroke="#34d399" stroke-width="1.5"/>
  <text x="366" y="94" class="mono b" font-size="13" fill="#34d399">GUARDED TURBO</text>
  <text x="736" y="94" text-anchor="end" class="mono t2" font-size="10">npx t3-pilot shield</text>
  <text x="366" y="112" class="mono t2" font-size="9.5">6 red-line rules · hard hook + soft skill · fails closed</text>

  <rect x="446" y="122" width="208" height="26" rx="7" fill="#0b2a1a" stroke="#34d399"/>
  <text x="550" y="139.5" text-anchor="middle" class="mono b" font-size="11" fill="#bbf7d0">.t3-pilot/shield.json</text>
  <line x1="510" y1="148" x2="456" y2="162" stroke="#475569" stroke-width="1.3" marker-end="url(#garr)"/>
  <line x1="590" y1="148" x2="644" y2="162" stroke="#475569" stroke-width="1.3" marker-end="url(#garr)"/>

  <rect x="364" y="164" width="180" height="38" rx="8" fill="#1a0c10" stroke="#f87171" stroke-opacity="0.8"/>
  <text x="454" y="180" text-anchor="middle" class="mono b" font-size="10" fill="#fca5a5">HARD · PreToolUse hook</text>
  <text x="454" y="195" text-anchor="middle" class="mono t2" font-size="9">deny | force_ask | allow</text>
  <rect x="556" y="164" width="180" height="38" rx="8" fill="#140f24" stroke="#a78bfa" stroke-opacity="0.8"/>
  <text x="646" y="180" text-anchor="middle" class="mono b" font-size="10" fill="#c4b5fd">SOFT · normative skill</text>
  <text x="646" y="195" text-anchor="middle" class="mono t2" font-size="9">guarded-turbo/SKILL.md</text>

  <text x="550" y="217" text-anchor="middle" class="mono b" font-size="9" fill="#34d399">1-click sync · unified diff · atomic rollback</text>
  <line x1="423" y1="221" x2="423" y2="228" stroke="#34d399" stroke-width="1.3" marker-end="url(#garrg)"/>
  <line x1="550" y1="221" x2="550" y2="228" stroke="#34d399" stroke-width="1.3" marker-end="url(#garrg)"/>
  <line x1="677" y1="221" x2="677" y2="228" stroke="#34d399" stroke-width="1.3" marker-end="url(#garrg)"/>

  <rect x="364" y="230" width="118" height="38" rx="7" class="row"/>
  <text x="423" y="246" text-anchor="middle" class="sans b t1" font-size="10.5">Antigravity</text>
  <text x="423" y="260" text-anchor="middle" class="mono t2" font-size="8.5">.agents/hooks.json</text>
  <rect x="491" y="230" width="118" height="38" rx="7" class="row"/>
  <text x="550" y="246" text-anchor="middle" class="sans b t1" font-size="10.5">Claude Code</text>
  <text x="550" y="260" text-anchor="middle" class="mono t2" font-size="8.5">.claude/settings.json</text>
  <rect x="618" y="230" width="118" height="38" rx="7" class="row"/>
  <text x="677" y="246" text-anchor="middle" class="sans b t1" font-size="10.5">Codex</text>
  <text x="677" y="260" text-anchor="middle" class="mono t2" font-size="8.5">.codex/rules/*.rules</text>

  <rect x="364" y="280" width="72" height="15" rx="4" fill="#3b0d12" stroke="#ef4444"/>
  <text x="400" y="291" text-anchor="middle" class="mono b" font-size="9" fill="#fca5a5">DENY</text>
  <text x="444" y="291.5" class="mono t2" font-size="9.5">rm -rf / · cat ~/.ssh · push -f main</text>
  <rect x="364" y="300" width="72" height="15" rx="4" fill="#3a2a06" stroke="#f59e0b"/>
  <text x="400" y="311" text-anchor="middle" class="mono b" font-size="9" fill="#fcd34d">FORCE_ASK</text>
  <text x="444" y="311.5" class="mono t2" font-size="9.5">npm publish · gh repo edit --visibility</text>
  <rect x="364" y="320" width="72" height="15" rx="4" fill="#052e1f" stroke="#10b981"/>
  <text x="400" y="331" text-anchor="middle" class="mono b" font-size="9" fill="#6ee7b7">ALLOW</text>
  <text x="444" y="331.5" class="mono t2" font-size="9.5">npm test · npm run build · git commit</text>

  <!-- ===== FULL ACCESS ===== -->
  <rect x="768" y="68" width="300" height="272" rx="14" fill="url(#gpanel)" stroke="#1f2a40"/>
  <text x="784" y="94" class="mono b" font-size="13" fill="#f87171">FULL ACCESS</text>
  <text x="1052" y="94" text-anchor="end" class="mono t3" font-size="10">unguarded host</text>
  <text x="784" y="112" class="mono t2" font-size="9.5">credentials &amp; git history exposed</text>

  <rect x="784" y="124" width="268" height="30" rx="7" class="row"/>
  <text x="796" y="143" class="mono t3" font-size="10">$</text>
  <text x="808" y="143" class="mono t1" font-size="10">rm -rf ~/</text>
  <rect x="1006" y="131" width="38" height="16" rx="5" fill="#3b0d12"/>
  <text x="1025" y="142.5" text-anchor="middle" class="mono b" font-size="9" fill="#fca5a5">RAN</text>

  <rect x="784" y="160" width="268" height="30" rx="7" class="row"/>
  <text x="796" y="179" class="mono t3" font-size="10">$</text>
  <text x="808" y="179" class="mono t1" font-size="10">cat ~/.ssh/id_ed25519</text>
  <rect x="1006" y="167" width="38" height="16" rx="5" fill="#3b0d12"/>
  <text x="1025" y="178.5" text-anchor="middle" class="mono b" font-size="9" fill="#fca5a5">RAN</text>

  <rect x="784" y="196" width="268" height="30" rx="7" class="row"/>
  <text x="796" y="215" class="mono t3" font-size="10">$</text>
  <text x="808" y="215" class="mono t1" font-size="10">git push -f origin main</text>
  <rect x="1006" y="203" width="38" height="16" rx="5" fill="#3b0d12"/>
  <text x="1025" y="214.5" text-anchor="middle" class="mono b" font-size="9" fill="#fca5a5">RAN</text>

  <rect x="784" y="232" width="268" height="30" rx="7" class="row"/>
  <text x="796" y="251" class="mono t3" font-size="10">$</text>
  <text x="808" y="251" class="mono t1" font-size="10">curl 169.254.169.254/…</text>
  <rect x="1006" y="239" width="38" height="16" rx="5" fill="#3b0d12"/>
  <text x="1025" y="250.5" text-anchor="middle" class="mono b" font-size="9" fill="#fca5a5">RAN</text>

  <text x="784" y="286" class="mono t3" font-size="9" letter-spacing="0.6">BLAST RADIUS</text>
  <rect x="784" y="294" width="268" height="8" rx="4" fill="#1e293b"/>
  <rect x="784" y="294" width="268" height="8" rx="4" fill="#ef4444"/>
  <text x="784" y="326" class="sans t2" font-size="11.5">Fast, until one bad tool call.</text>
</svg>
